services:
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    environment:
      APP_NAME: "DevMind AI Service"
      ENVIRONMENT: development
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_MODELS: ${NVIDIA_MODELS}
      NVIDIA_DEFAULT_MODEL: ${NVIDIA_DEFAULT_MODEL:-openai/gpt-oss-20b}
      REPAIR_SANDBOX_URL: http://repair-sandbox:8080
    ports:
      - "8000:8000"
    networks:
      - default
      - repair-internal
    depends_on:
      repair-sandbox:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  repair-sandbox:
    build:
      context: ./repair-sandbox
      dockerfile: Dockerfile
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 32
    networks:
      - repair-internal
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: devmind
      POSTGRES_USER: devmind_user
      POSTGRES_PASSWORD: devmind_local_password
    ports:
      - "5434:5432"
    volumes:
      - devmind_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U devmind_user -d devmind
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6381:6379"
    volumes:
      - devmind_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    environment:
      PORT: "5000"
      NODE_ENV: development
      AI_SERVICE_URL: http://ai-service:8000
      DATABASE_URL: "postgresql://devmind_user:devmind_local_password@postgres:5432/devmind?schema=public"
      REDIS_URL: redis://redis:6379
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      FRONTEND_URL: ${FRONTEND_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      OAUTH_CALLBACK_BASE_URL: ${OAUTH_CALLBACK_BASE_URL}
      GITHUB_CONNECT_CLIENT_ID: ${GITHUB_CONNECT_CLIENT_ID}
      GITHUB_CONNECT_CLIENT_SECRET: ${GITHUB_CONNECT_CLIENT_SECRET}
      GITHUB_TOKEN_ENCRYPTION_KEY: ${GITHUB_TOKEN_ENCRYPTION_KEY}
    ports:
      - "5002:5000"
    depends_on:
      ai-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  analysis-worker:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    command: ["node", "dist/workers/analysis.worker.js"]
    environment:
      NODE_ENV: development
      AI_SERVICE_URL: http://ai-service:8000
      REDIS_URL: redis://redis:6379
    depends_on:
      ai-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    depends_on:
      api-gateway:
        condition: service_healthy

networks:
  repair-internal:
    internal: true

volumes:
  devmind_postgres_data:
  devmind_redis_data:


services:
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    environment:
      APP_NAME: "DevMind AI Service"
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: devmind
      POSTGRES_USER: devmind_user
      POSTGRES_PASSWORD: devmind_local_password
    ports:
      - "5434:5432"
    volumes:
      - devmind_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U devmind_user -d devmind
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    environment:
      PORT: "5000"
      NODE_ENV: development
      AI_SERVICE_URL: http://ai-service:8000
      DATABASE_URL: "postgresql://devmind_user:devmind_local_password@postgres:5432/devmind?schema=public"
    ports:
      - "5001:5000"
    depends_on:
      ai-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  devmind_postgres_data:
